<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Entrar · Renovação de certificados</title>
<link href="/fonts.css" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--sf:#fff;--tx:#14263a;--mu:#5d6b7a;--ln:#dce2e8;--ac:#0f6f73;--ac2:#e3f1f1}
@media (prefers-color-scheme:dark){:root{--bg:#0f1820;--sf:#16212c;--tx:#e8eef4;--mu:#9aa9b8;--ln:#293846;--ac:#5cc4c7;--ac2:#13343a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--tx);font:15px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding:24px}
.card{width:100%;max-width:380px;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:28px;box-shadow:0 18px 40px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 4px}
p.sub{margin:0 0 22px;color:var(--mu);font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input:focus{outline:2px solid var(--ac2);border-color:var(--ac)}
button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:600 15px Figtree,system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;margin-top:14px;font-size:13px;color:#b42318}
.dica{margin-top:18px;font-size:12px;color:var(--mu);text-align:center}
</style>
</head>
<body>
<main class="card">
  <h1>Renovação de certificados</h1>
  <p class="sub">Entre para acessar o painel.</p>
  <form id="form">
    <label for="usuario">Usuário</label>
    <input id="usuario" name="usuario" value="Master" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required autofocus>
    <button id="entrar" type="submit">Entrar</button>
  </form>
  <div class="msg" id="msg" role="alert"></div>
  <p class="dica">Se o painel usa Cloudflare Access, o login é feito pelo provedor configurado.</p>
</main>
<script>
const params = new URLSearchParams(location.search);
function destinoSeguro(next) {
  if (!next) return "/";
  try {
    const u = new URL(next, location.origin);
    if (u.origin !== location.origin) return "/";
    return u.pathname + u.search + u.hash;
  } catch {
    return "/";
  }
}
const destino = destinoSeguro(params.get("next"));
const msg = document.getElementById("msg");
const botao = document.getElementById("entrar");

(async () => {
  try {
    const r = await fetch("/api/eu", { headers: { Accept: "application/json" } });
    if (r.ok) location.replace(destino);
  } catch {}
})();

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.textContent = "";
  botao.disabled = true;
  try {
    const r = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Requested-With": "fetch" },
      body: JSON.stringify({
        usuario: document.getElementById("usuario").value.trim(),
        senha: document.getElementById("senha").value,
      }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.erro || "Não foi possível entrar.");
    location.replace(destino);
  } catch (err) {
    msg.textContent = err.message || "Não foi possível entrar.";
    botao.disabled = false;
  }
});
</script>
</body>
</html>
